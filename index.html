<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos: Count Your Days - The Battle Bricks</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #030308;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-container {
            background: linear-gradient(135deg, #0a0a14, #121224);
            border: 3px solid #00e5ff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.4);
            position: relative;
        }

        h1 { 
            color: #00e5ff; 
            margin-top: 0; 
            font-size: 22px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        p { font-size: 13px; color: #ccc; line-height: 1.5; }

        /* Screens */
        .menu-screen, .game-screen { display: none; }
        .menu-screen.active, .game-screen.active { display: block; }

        .logo-icon {
            font-size: 45px;
            margin: 5px 0 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #00e5ff); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 15px #ff3333); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px #00e5ff); }
        }

        .instructions {
            background: rgba(15, 15, 30, 0.9);
            border: 1px solid #ffcc00;
            border-left: 5px solid #ffcc00;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            margin: 12px 0;
            font-size: 12px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.1); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.02); box-shadow: 0 0 15px currentColor; }

        /* Boss Area Visuals (Dựa theo ảnh Chronos Battle Bricks) */
        .boss-area {
            position: relative;
            width: 100%;
            height: 180px;
            background: #e8f4f8;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #ff3333;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .red-line-left, .red-line-right {
            position: absolute;
            top: 0;
            width: 60px;
            height: 100%;
            border: 4px solid #ff0000;
            box-shadow: 0 0 10px #ff0000;
            pointer-events: none;
        }
        .red-line-left { left: -10px; border-right: none; transform: skewX(-15deg); }
        .red-line-right { right: -10px; border-left: none; transform: skewX(15deg); }

        .chronos-eye-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clock-ring {
            position: absolute;
            width: 130px;
            height: 130px;
            border: 8px dashed #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00e5ff;
            animation: spin 20s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .eye-outer {
            width: 100px;
            height: 50px;
            border: 4px solid #00e5ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff;
            position: relative;
            z-index: 2;
        }

        .eye-pupil {
            width: 28px;
            height: 28px;
            background: #00e5ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00e5ff;
        }

        /* Boss Health & Status */
        .boss-status {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .hp-bar-container {
            width: 100%;
            background: #222;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        /* Puzzle Arena */
        .puzzle-arena {
            background: rgba(15, 15, 28, 0.9);
            border: 2px dashed #00e5ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }

        .clock-emoji {
            font-size: 42px;
            filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.6));
        }

        .math-symbol {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        .roman-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff3333;
        }

        input[type="number"] {
            width: 130px;
            font-size: 22px;
            text-align: center;
            padding: 8px;
            border: 2px solid #555;
            background: #0a0a0f;
            color: #fff;
            border-radius: 8px;
            outline: none;
            margin: 8px 0;
        }
        input[type="number"]:focus { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 8px;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-action:hover { background: #e6b800; transform: scale(1.05); }

        #result-msg { font-size: 14px; font-weight: bold; margin-top: 8px; min-height: 20px; }

        /* Hidden YouTube Audio iFrames */
        .audio-iframe { display: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="menu-screen active">
            <h1>CHRONOS: TIME TRIALS</h1>
            <div class="logo-icon">⏳👁️⌛</div>
            <div class="instructions">
                <b>📖 Hướng dẫn quy tắc thời gian:</b><br>
                • Quan sát các <b>Biểu tượng đồng hồ</b> xuất hiện trên màn hình.<br>
                • Tự nhìn kim đồng hồ để đọc giờ (Ví dụ: 🕒 = 3h, 🕕 = 6h, 🕛 = 12
