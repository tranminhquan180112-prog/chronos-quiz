<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Quiz - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #03030a;
            font-family: monospace, 'Courier New', Courier;
            color: #fff;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        /* Boss Chronos to hơn một chút (200px) */
        .chronos-container {
            width: 100%;
            height: 32vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .chronos-svg {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 0 20px #00ffff);
            animation: floatAnim 3s infinite ease-in-out;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .ui-container {
            width: 100%;
            max-width: 380px;
            z-index: 2;
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        .game-card {
            background: #0a0a18;
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-subtitle {
            font-size: 10px;
            color: #ff3366;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instructions {
            background: #000;
            border-left: 3px solid #ffcc00;
            padding: 6px 8px;
            text-align: left;
            font-size: 10px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .difficulty-header {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 10px;
            margin: 4px 0;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            background: #111122;
        }
        .btn-baby { color: #ff69b4; border-color: #ff69b4; }
        .btn-easy { color: #00ff66; border-color: #00ff66; }
        .btn-normal { color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { color: #ff3333; border-color: #ff3333; }

        .back-ingame-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: #220000;
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            display: none;
        }

        .hud-overlay {
            background: #000;
            border: 1px solid #ff3333;
            border-radius: 8px;
            padding: 4px 8px;
            text-align: center;
            margin-bottom: 6px;
        }

        .hp-bar-container {
            width: 100%;
            background: #222;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 2px;
        }
        .hp-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.3s; }

        .lives-display {
            font-size: 11px;
            color: #ff3366;
            margin-top: 2px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
            background: #000;
            padding: 6px;
            border-radius: 8px;
            border: 1px dashed #00ffff;
        }

        .clock-canvas {
            width: 55px;
            height: 55px;
            background: #111122;
            border-radius: 50%;
        }

        .math-symbol { font-size: 16px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 14px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }

        .btn-option {
            background: #111122;
            border: 1.5px solid #00ffff;
            color: #fff;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body onclick="unlockAudio()">

    <!-- Audio Elements cho nhạc nền YouTube -->
    <!-- Menu Music: https://youtu.be/cH_Nk_PPCzQ -->
    <audio id="menu-audio" loop src="https://www.youtube.com/watch?v=cH_Nk_PPCzQ" preload="auto"></audio>
    <!-- Battle Music: https://youtu.be/0V49vqh2sTg -->
    <audio id="battle-audio" loop src="https://www.youtube.com/watch?v=0V49vqh2sTg" preload="auto"></audio>

    <button class="back-ingame-btn" id="ingame-back-btn" onclick="returnToMenu()">⬅ MENU</button>

    <!-- Nửa trên: Boss Chronos to hơn -->
    <div class="chronos-container">
        <svg class="chronos-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="6,4" />
            <circle cx="50" cy="50" r="35" fill="#050515" stroke="#ff3366" stroke-width="1.5" />
            <ellipse cx="50" cy="50" rx="25" ry="12" fill="#000" stroke="#00ffff" stroke-width="2" />
            <circle cx="50" cy="50" r="6" fill="#ff3366" />
            <circle cx="50" cy="50" r="2" fill="#fff" />
        </svg>
    </div>

    <!-- Nửa dưới: Giao diện game -->
    <div class="ui-container">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="game-card screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính:</b> Chỉ cộng giá trị <b>KIM GIỜ ĐỎ (NGẮN)</b>.<br>
                • Kim phút xanh được thêm vào để thử thách.
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-baby" onclick="startGame('baby')"><span>Baby (1 Đồng - 67 Mạng) <i style="font-size:8px;">(chỉ dành cho em bé)</i></span> <span>3600s</span></button>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>60s</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>45s</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>25s</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>20s</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="game-card screen">
            <div class="hud-overlay">
                <div style="font-size: 10px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 8px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 9px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:2px; font-size:10px; min-height:14px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <script>
        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 60000;
        let timerInterval = null;
        let isPlaying = false;
        let currentDifficulty = 'normal';
        let audioUnlocked = false;

        const difficulties = {
            baby: { time: 3600000, count: 1, lives: 67 },
            easy: { time: 60000, count: 1, lives: 3 },
            normal: { time: 45000, count: 2, lives: 3 },
            hard: { time: 25000, count: 3, lives: 2 },
            nightmare: { time: 20000, count: 4, lives: 1 }
        };

        const victoryQuotes = {
            baby: "赤ちゃんつよいね…！",
            easy: "ただ試していただけさ",
            normal: "さあ、本気を出そうか",
            hard: "何かおかしいぞ…",
            nightmare: "馬鹿な…どうやってやり遂げたんだ！？"
        };

        const correctQuotes = [
            "ちっ…やるな！",
            "フッ、偶然だな…",
            "次もその運が続くかな？",
            "面白い…だが次はどうかな？"
        ];

        function unlockAudio() {
            if (!audioUnlocked) {
                audioUnlocked = true;
                playMenuMusic();
            }
        }

        function playMenuMusic() {
            const menuAudio = document.getElementById("menu-audio");
            const battleAudio = document.getElementById("battle-audio");
            battleAudio.pause();
            battleAudio.currentTime = 0;
            menuAudio.play().catch(e => console.log("Audio autoplay restricted"));
        }

        function playBattleMusic() {
            const menuAudio = document.getElementById("menu-audio");
            const battleAudio = document.getElementById("battle-audio");
            menuAudio.pause();
            menuAudio.currentTime = 0;
            battleAudio.play().catch(e => console.log("Audio autoplay restricted"));
        }

        function toRoman(num) {
            if (num <= 0) return "0";
            const romanMap = [
                { val: 40, str: "XL" }, { val: 10, str: "X" },
                { val: 9, str: "IX" }, { val: 5, str: "V" },
                { val: 4, str: "IV" }, { val: 1, str: "I" }
            ];
            let res = "";
            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i].val) {
                    res += romanMap[i].str;
                    num -= romanMap[i].val;
                }
            }
            return res;
        }

        function drawClockToCanvas(canvasId, hour, minute) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            ctx.beginPath();
            ctx.arc(radius, radius, radius - 2, 0, 2 * Math.PI);
            ctx.fillStyle = "#111122";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ffff";
            ctx.stroke();

            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const innerRadius = radius - 8;
                const outerRadius = radius - 3;
                
                const x1 = radius + Math.cos(angle) * innerRadius;
                const y1 = radius + Math.sin(angle) * innerRadius;
                const x2 = radius + Math.cos(angle) * outerRadius;
                const y2 = radius + Math.sin(angle) * outerRadius;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = (i % 3 === 0) ? 2 : 1;
                ctx.strokeStyle = (i % 3 === 0) ? "#00ffff" : "#8888aa";
                ctx.stroke();
            }

            // Kim phút (xanh - dài)
            const minuteAngle = (minute * 6 - 90) * (Math.PI / 180);
            const minuteHandLength = radius * 0.70;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(minuteAngle) * minuteHandLength, radius + Math.sin(minuteAngle) * minuteHandLength);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ffcc";
            ctx.lineCap = "round";
            ctx.stroke();

            // Kim giờ (đỏ - ngắn)
            const hourAngle = (((hour % 12) + minute / 60) * 30 - 90) * (Math.PI / 180);
            const hourHandLength = radius * 0.45;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(hourAngle) * hourHandLength, radius + Math.sin(hourAngle) * hourHandLength);
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = "#ff3366";
            ctx.lineCap = "round";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(radius, radius, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
        }

        function updateLivesDisplay() {
            let livesText = "";
            if (currentLives > 10) {
                livesText = `❤️❤️ x ${currentLives}`;
            } else {
                for (let i = 0; i < currentLives; i++) {
                    livesText += "❤️";
                }
            }
            document.getElementById("lives-text").innerText = livesText;
        }

        function startGame(diff) {
            playBattleMusic();
            currentDifficulty = diff;
            maxTime = difficulties[diff].time;
            currentHp = maxHp;
            currentLives = difficulties[diff].lives;

            document.getElementById("hp-text").innerText = currentHp;
            document.getElementById("hp-bar").style.width = "100%";
            updateLivesDisplay();
            
            document.getElementById("options-container").style.display = "grid";
            document.getElementById("timer-bar-box").style.display = "block";
            document.getElementById("roman-timer-text").style.display = "block";

            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "block";
            document.getElementById("back-menu-btn").style.display = "none";
            
            nextPuzzle();
        }

        function returnToMenu() {
            playMenuMusic();
            clearInterval(timerInterval);
            isPlaying = false;
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("menu-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "none";
        }

        function nextPuzzle() {
            if (currentHp <= 0 || currentLives <= 0) return;
            
            isPlaying = true;
            document.getElementById("result-msg").innerText = "";
            
            let count = difficulties[currentDifficulty].count;
            let hours = [];
            let minutes = [];
            
            for (let i = 0; i < count; i++) {
                hours.push(Math.floor(Math.random() * 12) + 1);
                minutes.push(Math.floor(Math.random() * 12) * 5);
            }

            let result = hours[0];
            let htmlContent = `<canvas id="clock-0" class="clock-canvas" width="110" height="110"></canvas>`;

            for (let i = 1; i < count; i++) {
                result += hours[i];
                htmlContent += `<span class="math-symbol">+</span>`;
                htmlContent += `<canvas id="clock-${i}" class="clock-canvas" width="110" height="110"></canvas>`;
            }

            correctAnswer = ((result - 1) % 12 + 1);
            if (correctAnswer <= 0) correctAnswer += 12;

            document.getElementById("clocks-container").innerHTML = htmlContent;

            for (let i = 0; i < count; i++) {
                drawClockToCanvas(`clock-${i}`, hours[i], minutes[i]);
            }

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrongAns = Math.floor(Math.random() * 12) + 1;
                if (!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = "";
            options.forEach(opt => {
                optionsHtml += `<button class="btn-option" onclick="selectAnswer(${opt})">${toRoman(opt)}</button>`;
            });
            document.getElementById("options-container").innerHTML = optionsHtml;

            const timerLine = document.getElementById("timer-line");
            const romanText = document.getElementById("roman-timer-text");
            
            timerLine.style.width = "100%";
            romanText.innerText = toRoman(Math.ceil(maxTime / 1000));

            clearInterval(timerInterval);
            let startTime = Date.now();
            
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, maxTime - elapsed);
                
                timerLine.style.width = (remaining / maxTime * 100) + "%";
                let secondsLeft = Math.ceil(remaining / 1000);
                romanText.innerText = toRoman(secondsLeft);

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    handleFailure("HẾT GIỜ!");
                }
            }, 50);
        }

        function selectAnswer(selected) {
            if (!isPlaying) return;
            
            clearInterval(timerInterval);
            isPlaying = false;

            if (selected === correctAnswer) {
                currentHp -= damagePerHit;
                if (currentHp < 0) currentHp = 0;
                document.getElementById("hp-text").innerText = currentHp;
                document.getElementById("hp-bar").style.width = (currentHp / maxHp * 100) + "%";

                if (currentHp <= 0) {
                    document.getElementById("options-container").style.display = "none";
                    document.getElementById("timer-bar-box").style.display = "none";
                    document.getElementById("roman-timer-text").style.display = "none";
                    
                    let quote = victoryQuotes[currentDifficulty];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66;'><b>YOU WON!</b><br>"${quote}"</span>`;
                    document.getElementById("back-menu-btn").style.display = "inline-block";
                    document.getElementById("ingame-back-btn").style.display = "none";
                } else {
                    let randomQuote = correctQuotes[Math.floor(Math.random() * correctQuotes.length)];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66;'>ĐÚNG! Chronos: "${randomQuote}" (-6,000 HP)</span>`;
                    setTimeout(nextPuzzle, 1500);
                }
            } else {
                handleFailure("SAI!");
            }
        }

        function handleFailure(msg) {
            isPlaying = false;
            currentLives--;
            updateLivesDisplay();

            if (currentLives <= 0) {
                document.getElementById("options-container").style.display = "none";
                document.getElementById("timer-bar-box").style.display = "none";
                document.getElementById("roman-timer-text").style.display = "none";
                
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>GAME OVER! Chronos: "バカ野郎！" (Đúng: ${toRoman(correctAnswer)})</span>`;
                document.getElementById("back-menu-btn").style.display = "inline-block";
                document.getElementById("ingame-back-btn").style.display = "none";
            } else {
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>${msg} Chronos: "バカ野郎！" (Đúng: ${toRoman(correctAnswer)})</span>`;
                setTimeout(nextPuzzle, 2000);
            }
        }
    </script>
</body>
</html>
