<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #menu-screen {
            background: rgba(10, 10, 24, 0.90);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(6px);
        }

        #game-screen {
            position: absolute;
            bottom: 10px;
            background: rgba(10, 10, 24, 0.85);
            border: 2px solid #00ffff;
            border-radius: 14px;
            padding: 10px 14px;
            width: 95%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 10px;
            color: #ff3366;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 3px solid #ffcc00;
            padding: 6px 8px;
            text-align: left;
            font-size: 10px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .difficulty-header {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-baby { background: rgba(255, 105, 180, 0.1); color: #ff69b4; border-color: #ff69b4; }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.01); }

        .back-ingame-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #fff; }

        .hud-overlay {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 8px;
            padding: 5px 8px;
            text-align: center;
            margin-bottom: 6px;
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 7px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 2px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 12px;
            color: #ff3366;
            margin-top: 2px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .clock-canvas {
            width: 60px;
            height: 60px;
        }

        .math-symbol { font-size: 16px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 15px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 2px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ff3333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin: 6px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 1.5px solid #00ffff;
            color: #fff;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }
        .btn-option:hover {
            background: #00ffff;
            color: #000;
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-action:hover { background: #00b3b3; }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <button class="back-ingame-btn" id="ingame-back-btn" onclick="returnToMenu()">⬅ MENU</button>

    <canvas id="bg-canvas"></canvas>

    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính:</b> Chỉ cộng giá trị <b>KIM GIỜ ĐỎ (NGẮN)</b>.<br>
                • Kim phút xanh dương được thêm vào để đánh lừa thị giác.
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-baby" onclick="startGame('baby')"><span>Baby (1 Đồng - 67 Mạng) <i style="font-size:9px;">(chỉ dành cho em bé)</i></span> <span>3600s</span></button>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>60s</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>45s</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>25s</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>20s</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="hud-overlay">
                <div style="font-size: 10px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 8px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 9px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:2px; font-size:10px; min-height:14px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <script>
        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 60000;
        let timerInterval = null;
        let isPlaying = false;
        let currentDifficulty = 'normal';

        const difficulties = {
            baby: { time: 3600000, count: 1, lives: 67 },
            easy: { time: 60000, count: 1, lives: 3 },
            normal: { time: 45000, count: 2, lives: 3 },
            hard: { time: 25000, count: 3, lives: 2 },
            nightmare: { time: 20000, count: 4, lives: 1 }
        };

        const victoryQuotes = {
            baby: "赤ちゃんつよいね…！",
            easy: "ただ試していただけさ",
            normal: "さあ、本気を出そうか",
            hard: "何かおかしいぞ…",
            nightmare: "馬鹿な…どうやってやり遂げたんだ！？"
        };

        const correctQuotes = [
            "ちっ…やるな！",
            "フッ、偶然だな…",
            "次もその運が続くかな？",
            "面白い…だが次はどうかな？"
        ];

        function toRoman(num) {
            if (num <= 0) return "0";
            const romanMap = [
                { val: 40, str: "XL" }, { val: 10, str: "X" },
                { val: 9, str: "IX" }, { val: 5, str: "V" },
                { val: 4, str: "IV" }, { val: 1, str: "I" }
            ];
            let res = "";
            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i].val) {
                    res += romanMap[i].str;
                    num -= romanMap[i].val;
                }
            }
            return res;
        }

        function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let angle = 0;
            function render() {
                ctx.fillStyle = "rgba(3, 3, 10, 0.4)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = canvas.width / 2;
                const cy = canvas.height * 0.28;

                angle += 0.01;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.arc(0, 0, 100, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 14]);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.beginPath();
                ctx.ellipse(0, 0, 80, 36, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fill();
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 3.5;
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 15;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(Math.sin(angle * 2) * 12, 0, 16, 0, Math.PI * 2);
                ctx.fillStyle = "#ff3366";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();

                requestAnimationFrame(render);
            }
            render();
        }

        function drawClockToCanvas(canvasId, hour, minute) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            ctx.beginPath();
            ctx.arc(radius, radius, radius - 2, 0, 2 * Math.PI);
            ctx.fillStyle = "#111122";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ffff";
            ctx.stroke();

            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const innerRadius = radius - 8;
                const outerRadius = radius - 3;
                
                const x1 = radius + Math.cos(angle) * innerRadius;
                const y1 = radius + Math.sin(angle) * innerRadius;
                const x2 = radius + Math.cos(angle) * outerRadius;
                const y2 = radius + Math.sin(angle) * outerRadius;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = (i % 3 === 0) ? 2 : 1;
                ctx.strokeStyle = (i % 3 === 0) ? "#00ffff" : "#8888aa";
                ctx.stroke();
            }

            const minuteAngle = (minute * 6 - 90) * (Math.PI / 180);
            const minuteHandLength = radius * 0.72;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(minuteAngle) * minuteHandLength, radius + Math.sin(minuteAngle) * minuteHandLength);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ffcc";
            ctx.lineCap = "round";
            ctx.stroke();

            const hourAngle = (((hour % 12) + minute / 60) * 30 - 90) * (Math.PI / 180);
            const hourHandLength = radius * 0.48;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(hourAngle) * hourHandLength, radius + Math.sin(hourAngle) * hourHandLength);
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = "#ff3366";
            ctx.lineCap = "round";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(radius, radius, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
        }

        function updateLivesDisplay() {
            let livesText = "";
            if (currentLives > 10) {
                livesText = `❤️❤️ x ${currentLives}`;
            } else {
                for (let i = 0; i < currentLives; i++) {
                    livesText += "❤️";
                }
            }
            document.getElementById("lives-text").innerText = livesText;
        }

        function startGame(diff) {
            currentDifficulty = diff;
            maxTime = difficulties[diff].time;
            currentHp = maxHp;
            currentLives = difficulties[diff].lives;

            document.getElementById("hp-text").innerText = currentHp;
            document.getElementById("hp-bar").style.width = "100%";
            updateLivesDisplay();
            
            document.getElementById("options-container").style.display = "grid";
            document.getElementById("timer-bar-box").style.display = "block";
            document.getElementById("roman-timer-text").style.display = "block";

            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "block";
            document.getElementById("back-menu-btn").style.display = "none";
            
            nextPuzzle();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            isPlaying = false;
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("menu-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "none";
        }

        function nextPuzzle() {
            if (currentHp <= 0 || currentLives <= 0) return;
            
            isPlaying = true;
            document.getElementById("result-msg").innerText = "";
            
            let count = difficulties[currentDifficulty].count;
            let hours = [];
            let minutes = [];
            
            for (let i = 0; i < count; i++) {
                hours.push(Math.floor(Math.random() * 12) + 1);
                minutes.push(Math.floor(Math.random() * 12) * 5);
            }

            let result = hours[0];
            let htmlContent = `<div class="clock-canvas-box"><canvas id="clock-0" class="clock-canvas" width="120" height="120"></canvas></div>`;

            for (let i = 1; i < count; i++) {
