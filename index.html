<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #menu-screen {
            background: rgba(10, 10, 24, 0.90);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(6px);
        }

        #game-screen {
            position: absolute;
            bottom: 10px;
            background: rgba(10, 10, 24, 0.85);
            border: 2px solid #00ffff;
            border-radius: 14px;
            padding: 10px 14px;
            width: 95%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 10px;
            color: #ff3366;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 3px solid #ffcc00;
            padding: 6px 8px;
            text-align: left;
            font-size: 10px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .difficulty-header {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-baby { background: rgba(255, 105, 180, 0.1); color: #ff69b4; border-color: #ff69b4; }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.01); }

        .back-ingame-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #fff; }

        .hud-overlay {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 8px;
            padding: 5px 8px;
            text-align: center;
            margin-bottom: 6px;
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 7px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 2px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 12px;
            color: #ff3366;
            margin-top: 2px;
            font-weight: bold;
            max-height: 40px;
            overflow-y: auto;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .clock-canvas {
            width: 60px;
            height: 60px;
        }

        .math-symbol { font-size: 16px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 15px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 2px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ff3333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin: 6px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 1.5px solid #00ffff;
            color: #fff;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }
        .btn-option:hover {
            background: #00ffff;
            color: #000;
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-action:hover { background: #00b3b3; }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <button class="back-ingame-btn" id="ingame-back-btn" onclick="returnToMenu()">⬅ MENU</button>

    <canvas id="bg-canvas"></canvas>

    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính:</b> Chỉ cộng giá trị <b>KIM GIỜ ĐỎ (NGẮN)</b>.<br>
                • Kim phút xanh dương được thêm vào để đánh lừa thị giác.
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-baby" onclick="startGame('baby')"><span>Baby (1 Đồng - 67 Mạng) <i style="font-size:9px;">(chỉ dành cho em bé)</i></span> <span>3600s</span></button>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>60s</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>45s</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>25s</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>20s</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="hud-overlay">
                <div style="font-size: 10px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 8px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 9px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:2px; font-size:10px; min-height:14px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>
