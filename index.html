<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D - Game Over Audio SFX</title>
    <!-- Thư viện Three.js dựng đồ họa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Lớp UI đè lên 3D Canvas */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Nút Fullscreen */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .fullscreen-btn:hover {
            background: #00ffff;
            color: #000;
            transform: scale(1.05);
        }

        .game-card {
            background: rgba(10, 10, 20, 0.88);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px 25px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 12px;
            color: #ff3366;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.65);
            border-left: 4px solid #ffcc00;
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            color: #ddd;
            line-height: 1.5;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.02); box-shadow: 0 0 15px currentColor; }

        /* HUD Trận đấu */
        .hud-overlay {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 10px 15px;
            text-align: center;
            pointer-events: auto;
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 16px;
            color: #ff3366;
            margin-top: 5px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }

        .clock-emoji {
            font-size: 42px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
        }

        .math-symbol { font-size: 22px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 22px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff3333;
        }

        input[type="number"] {
            width: 130px;
            font-size: 22px;
            text-align: center;
            padding: 6px;
            border: 2px solid #00ffff;
            background: #000;
            color: #fff;
            border-radius: 8px;
            outline: none;
            margin: 6px 0;
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .btn-action:hover { background: #00b3b3; transform: scale(1.05); }

        .screens { display: none; }
        .screens.active { display: block; }

        .audio-iframe { display: none; }
    </style>
</head>
<body>

    <!-- Nút Bật / Tắt Fullscreen -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()">Full Screen ⛶</button>

    <!-- Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="game-card screens active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
