<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            pointer-events: none;
        }

        .game-card {
            background: rgba(10, 10, 24, 0.95);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            max-height: 92vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 11px;
            color: #ff3366;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.65);
            border-left: 4px solid #ffcc00;
            padding: 10px;
            text-align: left;
            font-size: 12px;
            color: #dddddd;
            line-height: 1.5;
            margin-bottom: 14px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.02); box-shadow: 0 0 12px currentColor; }

        .settings-box {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #00ffff;
        }

        .btn-setting {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-setting:hover { background: #00ffff; color: #000; }

        .back-ingame-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #ffffff; }

        .hud-overlay {
            position: absolute;
            top: 10px;
            width: 80%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            pointer-events: auto;
        }

        .hp-bar-container {
            width: 100%;
            background: #111111;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 16px;
            color: #ff3366;
            margin-top: 4px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 14px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .clock-canvas {
            width: 85px;
            height: 85px;
        }

        .math-symbol { font-size: 24px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 22px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 4px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff3333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }
        .btn-option:hover {
            background: #00ffff;
            color: #000000;
            box-shadow: 0 0 15px #00ffff;
            transform: scale(1.02);
        }

        .timer-bar {
            width: 100%;
            background: #222222;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .btn-action:hover { background: #00b3b3; transform: scale(1.05); }

        .screen { display: none; }
        .screen.active { display: block; }
        .audio-iframe { display: none; }
    </style>
</head>
<body>

    <button class="back-ingame-btn" id="ingame-back-btn">⬅ MENU</button>

    <!-- Canvas Nền Game -->
    <canvas id="bg-canvas"></canvas>

    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="game-card screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính đồng hồ:</b> chỉ lấy kim giờ cộng với kim giờ (kim ngắn).<br>
                • <b>Hãy tính thật nhanh để chọn đáp án đúng nhất.</b>
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-easy" data-diff="easy"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>XXXs</span></button>
            <button class="btn-diff btn-normal" data-diff="normal"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>XXs</span></button>
            <button class="btn-diff btn-hard" data-diff="hard"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>XVs</span></button>
            <button class="btn-diff btn-nightmare" data-diff="nightmare"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>XVs</span></button>

            <div class="settings-box">
                <span>🎵 Nhạc nền:</span>
                <button class="btn-setting" id="music-toggle-btn">BẬT</button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen" style="width:100%; height:100%; position:relative;">
            <div style="display:flex; justify-content:center; width:100%;">
                <div class="hud-overlay">
                    <div style="font-size: 12px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                    <div style="font-size: 10px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                    <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                    <div class="lives-display" id="lives-text">❤️❤️❤️</div>
                </div>
            </div>

            <div style="position:absolute; bottom: 15px; width:100%; display:flex; justify-content:center;">
                <div class="game-card" id="puzzle-wrapper
