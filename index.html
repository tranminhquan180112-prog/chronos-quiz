<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-card {
            background: rgba(10, 10, 24, 0.95);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.35);
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 11px;
            color: #ff3366;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.65);
            border-left: 4px solid #ffcc00;
            padding: 10px;
            text-align: left;
            font-size: 12px;
            color: #dddddd;
            line-height: 1.5;
            margin-bottom: 14px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }

        .hud-overlay {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .hp-bar-container {
            width: 100%;
            background: #111111;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; }

        .lives-display {
            font-size: 15px;
            color: #ff3366;
            margin-top: 4px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas {
            width: 80px;
            height: 80px;
            background: #111122;
            border-radius: 50%;
            border: 2px solid #00ffff;
        }

        .math-symbol { font-size: 22px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .timer-bar {
            width: 100%;
            background: #222222;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; }

        .btn-action {
            background: #00ffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
        }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính đồng hồ:</b> chỉ lấy kim giờ cộng với kim giờ (kim ngắn).<br>
                • <b>Hãy tính thật nhanh để chọn đáp án đúng nhất.</b>
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>XXXs</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>XXs</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>XVs</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>XVs</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="hud-overlay">
                <div style="font-size: 12px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 10px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 11px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:6px; font-size:13px; min-height:18px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <script>
        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 30000;
        let timerInterval = null;
        let isPlaying = false;
        let currentDifficulty = 'normal';

        const difficulties = {
            easy: { time: 30000, count: 1, lives: 3 },
            normal: { time: 20000, count: 2, lives: 3 },
            hard: { time: 15000, count: 3, lives: 2 },
            nightmare: { time: 15000, count: 4, lives: 1 }
        };

        const victoryQuotes = {
            easy: "ただ試していただけさ",
            normal: "さあ、本気を出そうか",
            hard: "何かおかしいぞ…",
            nightmare: "馬鹿な…どうやってやり遂げたんだ！？"
        };

        function toRoman(num) {
            if (num <= 0) return "0";
            const romanMap = [
                { val: 40, str: "XL" }, { val: 10, str: "X" },
                { val: 9, str: "IX" }, { val: 5, str: "V" },
                { val: 4, str: "IV" }, { val: 1, str: "I" }
            ];
            let res = "";
            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i].val) {
                    res += romanMap[i].str;
                    num -= romanMap[i].val;
                }
            }
            return res;
        }

        function drawClock(canvasId, hour) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const innerRadius = radius - 10;
                const outerRadius = radius - 4;
                
                const x1 = radius + Math.cos(angle) * innerRadius;
                const y1 = radius + Math.sin(angle) * innerRadius;
                const x2 = radius + Math.cos(angle) * outerRadius;
                const y2 = radius + Math.sin(angle) * outerRadius;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = (i % 3 === 0) ? 3 : 1;
                ctx.strokeStyle = (i % 3 === 0) ? "#00ffff" : "#8888aa";
                ctx.stroke();
            }

            const hourAngle = ((hour % 12) * 30 - 90) * (Math.PI / 180);
            const handLength = radius * 0.55;
            
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(hourAngle) * handLength, radius + Math.sin(hourAngle) * handLength);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#ff3366";
            ctx.lineCap = "round";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(radius, radius, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < currentLives; i++) {
                hearts += "❤️";
            }
            document.getElementById("lives-text").innerText = hearts;
        }

        function startGame(diff) {
            currentDifficulty = diff;
            maxTime = difficulties[diff].time;
            currentHp = maxHp;
            currentLives = difficulties[diff].lives;

            document.getElementById("hp-text").innerText = currentHp;
            document.getElementById("hp-bar").style.width = "100%";
            updateLivesDisplay();
            
            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            
            nextPuzzle();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            isPlaying = false;
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("menu-screen").classList.add("active");
        }

        function nextPuzzle() {
            if (currentHp <= 0 || currentLives <= 0) return;
            
            isPlaying = true;
            document.getElementById("result-msg").innerText = "";
            
            let count = difficulties[currentDifficulty].count;
            let hours = [];
            
            for (let i = 0; i < count; i++) {
                hours.push(Math.floor(Math.random() * 12) + 1);
            }

            let result = hours[0];
            let htmlContent = `<canvas id="clock-0" class="clock-canvas" width="160" height="160"></canvas>`;

            for (let i = 1; i < count; i++) {
                result += hours[i];
                htmlContent += `<span class="math-symbol">+</span>`;
                htmlContent += `<canvas id="clock-${i}" class="clock-canvas" width="160" height="160"></canvas>`;
            }

            correctAnswer = ((result - 1) % 12 + 1);
            if (correctAnswer <= 0) correctAnswer += 12;

            document.getElementById("clocks-container").innerHTML = htmlContent;

            for (let i = 0; i < count; i++) {
                drawClock(`clock-${i}`, hours[i]);
            }

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrongAns = Math.floor(Math.random() * 12) + 1;
                if (!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = "";
            options.forEach(opt => {
                optionsHtml += `<button class="btn-option" onclick="selectAnswer(${opt})">${toRoman(opt)}</button>`;
            });
            document.getElementById("options-container").innerHTML = optionsHtml;

            const timerLine = document.getElementById("timer-line");
            const romanText = document.getElementById("roman-timer-text");
            
            timerLine.style.width = "100%";
            romanText.innerText = toRoman(Math.ceil(maxTime / 1000));

            clearInterval(timerInterval);
            let startTime = Date.now();
            
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, maxTime - elapsed);
                
                timerLine.style.width = (remaining / maxTime * 100) + "%";
                let secondsLeft = Math.ceil(remaining / 1000);
                romanText.innerText = toRoman(secondsLeft);

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    handleFailure("HẾT GIỜ! Bạn mất 1 mạng.");
                }
            }, 50);
        }

        function selectAnswer(selected) {
            if (!isPlaying) return;
            
            clearInterval(timerInterval);
            isPlaying = false;

            if (selected === correctAnswer) {
                currentHp -= damagePerHit;
                if (currentHp < 0) currentHp = 0;
                document.getElementById("hp-text").innerText = currentHp;
                document.getElementById("hp-bar").style.width = (currentHp / maxHp * 100) + "%";

                if (currentHp <= 0) {
                    document.getElementById("options-container").style.display = "none";
                    document.getElementById("timer-bar-box").style.display = "none";
                    document.getElementById("roman-timer-text").innerText = "";
                    
                    let quote = victoryQuotes[currentDifficulty];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66; font-size: 14px;'><b>YOU WON!</b><br><br>"${quote}"</span>`;
                    document.getElementById("back-menu-btn").style.display = "inline-block";
                } else {
                    document.getElementById("result-msg").innerHTML = "<span style='color: #00ff66;'>CHÍNH XÁC! Chronos bị trừ 6,000 HP.</span>";
                    setTimeout(nextPuzzle, 1500);
                }
            } else {
                handleFailure("SAI ĐÁP ÁN! Bạn mất 1 mạng.");
            }
        }

        function handleFailure(msg) {
            isPlaying = false;
            currentLives--;
            updateLivesDisplay();

            if (currentLives <= 0) {
                document.getElementById("options-container").style.display = "none";
                document.getElementById("timer-bar-box").style.display = "none";
                document.getElementById("roman-timer-text").innerText = "";
                
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>GAME OVER! バカ野郎！ (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                document.getElementById("back-menu-btn").style.display = "inline-block";
            } else {
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>${msg} バカ野郎！ (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                setTimeout(nextPuzzle, 2000);
            }
        }
    </script>
</body>
</html>
