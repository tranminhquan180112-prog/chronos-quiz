<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D - God of Time</title>
    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            pointer-events: none;
        }

        .game-card {
            background: rgba(10, 10, 20, 0.95);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            max-height: 95vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 11px;
            color: #ff3366;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 4px solid #ffcc00;
            padding: 8px 10px;
            text-align: left;
            font-size: 11px;
            color: #ddd;
            line-height: 1.5;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.01); box-shadow: 0 0 12px currentColor; }

        .back-ingame-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #fff; }

        .hud-overlay {
            position: absolute;
            top: 10px;
            width: 70%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            pointer-events: auto;
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 15px;
            color: #ff3366;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Khung hiển thị mặt đồng hồ vạch */
        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 14px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .clock-canvas {
            width: 90px;
            height: 90px;
        }

        .math-symbol { font-size: 24px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 4px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff3333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }
        .btn-option:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
            transform: scale(1.02);
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }
        .btn-action:hover { background: #00b3b3; transform: scale(1.05); }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <button class="back-ingame-btn" id="ingame-back-btn">⬅ MENU</button>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="game-card screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính đồng hồ:</b> chỉ lấy kim giờ cộng với kim giờ (kim ngắn).<br>
                • <b>Hãy tính thật nhanh để chọn đáp án đúng nhất.</b>
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-easy" data-diff="easy"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>XXXs</span></button>
            <button class="btn-diff btn-normal" data-diff="normal"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>XXs</span></button>
            <button class="btn-diff btn-hard" data-diff="hard"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>XVs</span></button>
            <button class="btn-diff btn-nightmare" data-diff="nightmare"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>XVs</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen" style="width:100%; height:100%; position:relative;">
            <div style="display:flex; justify-content:center; width:100%;">
                <div class="hud-overlay">
                    <div style="font-size: 12px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                    <div style="font-size: 10px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                    <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                    <div class="lives-display" id="lives-text">❤️❤️❤️</div>
                </div>
            </div>

            <div style="position:absolute; bottom: 15px; width:100%; display:flex; justify-content:center;">
                <div class="game-card" id="puzzle-wrapper">
                    <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 11px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
                    
                    <!-- Khung đồng hồ vạch -->
                    <div class="clocks-display" id="clocks-container"></div>

                    <!-- Lựa chọn trắc nghiệm số La Mã -->
                    <div class="options-grid" id="options-container"></div>
                    
                    <div class="roman-timer" id="roman-timer-text">XXX</div>

                    <div class="timer-bar" id="timer-bar-box">
                        <div class="timer-fill" id="timer-line"></div>
                    </div>

                    <div id="result-msg" style="margin-top:4px; font-size:12px; min-height:16px;"></div>
                    <button class="btn-action" id="back-menu-btn" style="display:none; background:#00ffff; color:#000; margin-top:6px;">QUAY LẠI MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let scene, camera, renderer;
        let chronosEye, clockRingMesh;

        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 30000;
        let timerInterval = null;
        let isPlaying = false;
        let currentDifficulty = 'normal';

        const difficulties = {
            easy: { time: 30000, count: 1, lives: 3 },
            normal: { time: 20000, count: 2, lives: 3 },
            hard: { time: 15000, count: 3, lives: 2 },
            nightmare: { time: 15000, count: 4, lives: 1 }
        };

        const victoryQuotes = {
            easy: "ただ試していただけさ",
            normal: "さあ、本気を出そうか",
            hard: "何かおかしいぞ…",
            nightmare: "馬鹿な…どうやってやり遂げたんだ！？"
        };

        function toRoman(num) {
            if (num <= 0) return "0";
            const romanMap = [
                { val: 40, str: "XL" }, { val: 10, str: "X" },
                { val: 9, str: "IX" }, { val: 5, str: "V" },
                { val: 4, str: "IV" }, { val: 1, str: "I" }
            ];
            let res = "";
            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i].val) {
                    res += romanMap[i].str;
                    num -= romanMap[i].val;
                }
            }
            return res;
        }

        // Vẽ mặt đồng hồ dạng vạch (không có số, chỉ có vạch chia giờ và kim giờ)
        function drawClockToCanvas(canvasId, hour) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            // Nền đồng hồ
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 4, 0, 2 * Math.PI);
            ctx.fillStyle = "#111122";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#00ffff";
            ctx.stroke();

            // Vẽ các vạch chia giờ xung quanh
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const innerRadius = radius - 12;
                const outerRadius = radius - 6;
                
                const x1 = radius + Math.cos(angle) * innerRadius;
                const y1 = radius + Math.sin(angle) * innerRadius;
                const x2 = radius + Math.cos(angle) * outerRadius;
                const y2 = radius + Math.sin(angle) * outerRadius;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = (i % 3 === 0) ? 3 : 1.5; // Vạch to ở các hướng 12, 3, 6, 9
                ctx.strokeStyle = (i % 3 === 0) ? "#00ffff" : "#8888aa";
                ctx.stroke();
            }

            // Vẽ kim giờ (kim ngắn)
            const hourAngle = ((hour % 12) * 30 - 90) * (Math.PI / 180);
            const handLength = radius * 0.55;
            
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(hourAngle) * handLength, radius + Math.sin(hourAngle) * handLength);
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#ff3366";
            ctx.lineCap = "round";
            ctx.stroke();

            // Tâm đồng hồ
            ctx.beginPath();
            ctx.arc(radius, radius, 4, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x03030a, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ffff, 2.5, 25);
            pointLight.position.set(0, 0, 5);
            scene.add(pointLight);

            const redLight = new THREE.PointLight(0xff0000, 3.5, 20);
            redLight.position.set(0, 2, 2);
            scene.add(redLight);

            const eyeGeo = new THREE.SphereGeometry(1.2, 32, 16);
            eyeGeo.scale(1.8, 0.8, 0.8);
            const eyeMat = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                emissive: 0x00e5ff,
                emissiveIntensity: 0.9,
                shininess: 100
            });
            chronosEye = new THREE.Mesh(eyeGeo, eyeMat);
            scene.add(chronosEye);

            const pupilGeo = new THREE.SphereGeometry(0.5, 32, 16);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const pupil = new THREE.Mesh(pupilGeo, pupilMat);
            pupil.position.z = 0.6;
            chronosEye.add(pupil);

            const ringGeo = new THREE.TorusGeometry(2.5, 0.08, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
            clockRingMesh = new THREE.Mesh(ringGeo, ringMat);
            clockRingMesh.position.z = -0.5;
            scene.add(clockRingMesh);

            const pillarGeo = new THREE.BoxGeometry(0.4, 6, 0.4);
            const pillarMat = new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.6 });
            
            const leftPillar = new THREE.Mesh(pillarGeo, pillarMat);
            leftPillar.position.set(-4, 0, -1);
            leftPillar.rotation.z = -0.25;
            scene.add(leftPillar);

            const rightPillar = new THREE.Mesh(pillarGeo, pillarMat);
            rightPillar.position.set(4, 0, -1);
            rightPillar.rotation.z = 0.25;
            scene.add(rightPillar);

            function animate() {
                requestAnimationFrame(animate);
                if (clockRingMesh) clockRingMesh.rotation.z -= 0.01;
                if (chronosEye) {
                    chronosEye.position.y = Math.sin(Date.now() * 0.002) * 0.15;
                    chronosEye.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function playCorrectSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, now);
            osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playWrongSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [300, 260, 220, 150];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + index * 0.15);
                gain.gain.setValueAtTime(0.4, now + index * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.15);
                osc.stop(now + index * 0.15 + 0.2);
            });
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < currentLives; i++) {
                hearts += "❤️";
            }
            document.getElementById("lives-text").innerText = hearts;
        }

        function startGame(diff) {
            currentDifficulty = diff;
            maxTime = difficulties[diff].time;
            currentHp = maxHp;
            currentLives = difficulties[diff].lives;

            document.getElementById("hp-text").innerText = currentHp;
            document.getElementById("hp-bar").style.width = "100%";
            updateLivesDisplay();
            
            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "block";
            document.getElementById("back-menu-btn").style.display = "none";
            document.getElementById("options-container").style.display = "grid";
            document.getElementById("timer-bar-box").style.display = "block";
            
            nextPuzzle();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            isPlaying = false;
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("menu-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "none";
        }

        function nextPuzzle() {
            if (currentHp <= 0 || currentLives <= 0) return;
            
            isPlaying = true;
            document.getElementById("puzzle-wrapper").style.display = "block";
            document.getElementById("result-msg").innerText = "";
            
            let count = difficulties[currentDifficulty].count;
            let hours = [];
            
            for (let i = 0; i < count; i++) {
                hours.push(Math.floor(Math.random() * 12) + 1);
            }

            let result = hours[0];
            let htmlContent = `<div class="clock-canvas-box"><canvas id="clock-0" class="clock-canvas" width="180" height="180"></canvas></div>`;

            for (let i = 1; i < count; i++) {
                result += hours[i];
                htmlContent += `<span class="math-symbol">+</span>`;
                htmlContent += `<div class="clock-canvas-box"><canvas id="clock-${i}" class="clock-canvas" width="180" height="180"></canvas></div>`;
            }

            correctAnswer = ((result - 1) % 12 + 1);
            if (correctAnswer <= 0) correctAnswer += 12;

            document.getElementById("clocks-container").innerHTML = htmlContent;

            // Vẽ mặt đồng hồ vạch lên các canvas
            for (let i = 0; i < count; i++) {
                drawClockToCanvas(`clock-${i}`, hours[i]);
            }

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrongAns = Math.floor(Math.random() * 12) + 1;
                if (!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = "";
            options.forEach(opt => {
                optionsHtml += `<button class="btn-option" onclick="selectAnswer(${opt})">${toRoman(opt)}</button>`;
            });
            document.getElementById("options-container").innerHTML = optionsHtml;

            const timerLine = document.getElementById("timer-line");
            const romanText = document.getElementById("roman-timer-text");
            
            timerLine.style.width = "100%";
            romanText.innerText = toRoman(Math.ceil(maxTime / 1000));

            clearInterval(timerInterval);
            let startTime = Date.now();
            
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, maxTime - elapsed);
                
                timerLine.style.width = (remaining / maxTime * 100) + "%";
                let secondsLeft = Math.ceil(remaining / 1000);
                romanText.innerText = toRoman(secondsLeft);

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    handleFailure("HẾT GIỜ! Bạn mất 1 mạng.");
                }
            }, 50);
        }

        function selectAnswer(selected) {
            if (!isPlaying) return;
            
            clearInterval(timerInterval);
            isPlaying = false;

            if (selected === correctAnswer) {
                playCorrectSound();

                currentHp -= damagePerHit;
                if (currentHp < 0) currentHp = 0;
                document.getElementById("hp-text").innerText = currentHp;
                document.getElementById("hp-bar").style.width = (currentHp / maxHp * 100) + "%";

                if (currentHp <= 0) {
                    document.getElementById("options-container").style.display = "none";
                    document.getElementById("timer-bar-box").style.display = "none";
                    document.getElementById("roman-timer-text").innerText = "";
                    
                    let quote = victoryQuotes[currentDifficulty];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66; font-size: 14px;'><b>YOU WON!</b><br><br>"${quote}"</span>`;
                    document.getElementById("back-menu-btn").style.display = "inline-block";
                    document.getElementById("ingame-back-btn").style.display = "none";
                } else {
                    document.getElementById("result-msg").innerHTML = "<span style='color: #00ff66;'>CHÍNH XÁC! Chronos bị trừ 6,000 HP.</span>";
                    setTimeout(nextPuzzle, 1500);
                }
            } else {
                handleFailure("SAI ĐÁP ÁN! Bạn mất 1 mạng.");
            }
        }

        function handleFailure(msg) {
            isPlaying = false;
            currentLives--;
            updateLivesDisplay();

            if (currentLives <= 0) {
                playGameOverSound();
                document.getElementById("options-container").style.display = "none";
                document.getElementById("timer-bar-box").style.display = "none";
                document.getElementById("roman-timer-text").innerText = "";
                
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>GAME OVER! バカ野郎！ (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                document.getElementById("back-menu-btn").style.display = "inline-block";
                document.getElementById("ingame-back-btn").style.display = "none";
            } else {
                playWrongSound();
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>${msg} バカ野郎！ (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                setTimeout(nextPuzzle, 2000);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}

            init3D();

            document.querySelectorAll(".btn-diff").forEach(btn => {
                btn.addEventListener("click", () => {
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    startGame(btn.getAttribute("data-diff"));
                });
            });

            document.getElementById("ingame-back-btn").addEventListener("click", returnToMenu);
            document.getElementById("back-menu-btn").addEventListener("click", returnToMenu);
        });
    </script>
</body>
</html>
