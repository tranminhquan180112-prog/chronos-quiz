<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D - Fixed Startup</title>
    <!-- Thư viện Three.js dựng đồ họa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Lớp UI đè lên 3D Canvas */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            pointer-events: none;
        }

        .game-card {
            background: rgba(10, 10, 20, 0.94);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            max-height: 95vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 11px;
            color: #ff3366;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 4px solid #ffcc00;
            padding: 8px 10px;
            text-align: left;
            font-size: 11px;
            color: #ddd;
            line-height: 1.5;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.01); box-shadow: 0 0 12px currentColor; }

        /* Màn hình chào ban đầu */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 8, 0.98);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .btn-start-game {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px #00ffff;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-start-game:hover { background: #00b3b3; transform: scale(1.05); }

        /* Cài đặt âm thanh ở Menu */
        .settings-box {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #00ffff;
        }

        .btn-setting {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-setting:hover { background: #00ffff; color: #000; }

        /* Nút quay lại Menu khi đang chơi */
        .back-ingame-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #fff; }

        /* HUD Trận đấu */
        .hud-overlay {
            position: absolute;
            top: 10px;
            width: 70%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            pointer-events: auto;
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 15px;
            color: #ff3366;
            margin-top: 4px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }

        .clock-emoji {
            font-size: 38px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
        }

        .math-symbol { font-size: 20px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 4px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff3333;
        }

        /* Khung chứa các nút lựa chọn trắc nghiệm */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

            background: rgba(0, 2
