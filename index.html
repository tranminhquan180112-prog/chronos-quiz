<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-card {
            background: rgba(10, 10, 24, 0.95);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.35);
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 11px;
            color: #ff3366;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.65);
            border-left: 4px solid #ffcc00;
            padding: 10px;
            text-align: left;
            font-size: 12px;
            color: #dddddd;
            line-height: 1.5;
            margin-bottom: 14px;
            border-radius: 6px;
        }

        .difficulty-header {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }

        .hud-overlay {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .hp-bar-container {
            width: 100%;
            background: #111111;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 4px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; }

        .lives-display {
            font-size: 15px;
            color: #ff3366;
            margin-top: 4px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas {
            width: 80px;
            height: 80px;
            background: #111122;
            border-radius: 50%;
            border: 2px solid #00ffff;
        }

        .math-symbol { font-size: 22px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .timer-bar {
            width: 100%;
            background: #222222;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; }

        .btn-action {
            background: #00ffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
        }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính đồng hồ:</b> chỉ lấy kim giờ cộng với kim giờ (kim ngắn).<br>
                • <b>Hãy tính thật nhanh để chọn đáp án đúng nhất.</b>
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>XXXs</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>XXs</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>XVs</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>XVs</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="hud-overlay">
                <div style="font-size: 12px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 10px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 11px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:6px; font-size:13px; min-height:18px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <script>
        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 30000;
