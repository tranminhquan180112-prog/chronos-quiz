<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #menu-screen {
            background: rgba(10, 10, 24, 0.90);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(6px);
        }

        #game-screen {
            position: absolute;
            bottom: 10px;
            background: rgba(10, 10, 24, 0.85);
            border: 2px solid #00ffff;
            border-radius: 14px;
            padding: 10px 14px;
            width: 95%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 10px;
            color: #ff3366;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 3px solid #ffcc00;
            padding: 6px 8px;
            text-align: left;
            font-size: 10px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .difficulty-header {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
