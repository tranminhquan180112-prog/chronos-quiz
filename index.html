<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz - God of Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #03030a;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            pointer-events: none;
        }

        .game-card {
            background: rgba(10, 10, 24, 0.85);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 12px 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            max-height: 95vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        .game-title {
            font-size: 24px;
            font-weight: 900;
            color: #00ffff;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 10px;
            color: #ff3366;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.7);
            border-left: 3px solid #ffcc00;
            padding: 6px 8px;
            text-align: left;
            font-size: 10px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .difficulty-header {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin: 5px 0;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; }
        .btn-diff:hover { filter: brightness(1.3); transform: scale(1.01); }

        .back-ingame-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
            display: none;
        }
        .back-ingame-btn:hover { background: #ff3333; color: #fff; }

        .hud-overlay {
            position: absolute;
            top: 8px;
            width: 75%;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 51, 0.5);
            border-radius: 10px;
            padding: 6px 10px;
            text-align: center;
            pointer-events: auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .hp-bar-container {
            width: 100%;
            background: #111;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ff3333;
            margin-top: 3px;
        }
        .hp-fill { width: 100%; height: 100%; background: #e63232; transition: width 0.3s; }

        .lives-display {
            font-size: 13px;
            color: #ff3366;
            margin-top: 2px;
            font-weight: bold;
        }

        .clocks-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 10px;
            border: 1px dashed rgba(0, 255, 255, 0.4);
        }

        .clock-canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .clock-canvas {
            width: 70px;
            height: 70px;
        }

        .math-symbol { font-size: 18px; font-weight: bold; color: #ffcc00; }

        .roman-timer {
            font-size: 16px;
            font-weight: bold;
            color: #ff3333;
            margin-top: 2px;
            letter-spacing: 2px;
            text-shadow: 0 0 6px #ff3333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }

        .btn-option {
            background: rgba(0, 255, 255, 0.1);
            border: 1.5px solid #00ffff;
            color: #fff;
            padding: 7px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }
        .btn-option:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 10px #00ffff;
        }

        .timer-bar {
            width: 100%;
            background: #222;
            height: 5px;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }
        .timer-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.05s linear; }

        .btn-action {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-action:hover { background: #00b3b3; }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <button class="back-ingame-btn" id="ingame-back-btn" onclick="returnToMenu()">⬅ MENU</button>

    <canvas id="bg-canvas"></canvas>

    <div class="ui-layer">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="game-card screen active">
            <div class="game-title">Chronos Quiz</div>
            <div class="game-subtitle">THE BATTLE BRICKS 3D</div>
            
            <div class="instructions">
                • <b>Cách tính:</b> Chỉ cộng giá trị <b>KIM GIỜ ĐỎ (NGẮN)</b>.<br>
                • Kim phút xanh lá/xanh dương được thêm vào để thử thách thị giác.
            </div>

            <div class="difficulty-header">CHỌN MỨC ĐỘ THỬ THÁCH:</div>
            <button class="btn-diff btn-easy" onclick="startGame('easy')"><span>1. Easy (1 Đồng - 3 Mạng)</span> <span>XXXs</span></button>
            <button class="btn-diff btn-normal" onclick="startGame('normal')"><span>2. Normal (2 Đồng - 3 Mạng)</span> <span>XXs</span></button>
            <button class="btn-diff btn-hard" onclick="startGame('hard')"><span>3. Hard (3 Đồng - 2 Mạng)</span> <span>XVs</span></button>
            <button class="btn-diff btn-nightmare" onclick="startGame('nightmare')"><span>4. Nightmare (4 Đồng - 1 Mạng)</span> <span>XVs</span></button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="game-card screen" style="max-width: 380px; position: absolute; bottom: 8px;">
            <div class="hud-overlay">
                <div style="font-size: 11px; color: #ff3333; font-weight: bold;">CHRONOS (GOD OF TIME)</div>
                <div style="font-size: 9px; color: #aaa; margin-top: 1px;">HP: <span id="hp-text">42000</span> / 42000</div>
                <div class="hp-bar-container"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="lives-display" id="lives-text">❤️❤️❤️</div>
            </div>

            <p style="margin: 0; color: #00ffff; font-weight: bold; font-size: 10px; letter-spacing: 1px;">COUNT YOUR DAYS!</p>
            
            <div class="clocks-display" id="clocks-container"></div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="roman-timer" id="roman-timer-text">XXX</div>

            <div class="timer-bar" id="timer-bar-box">
                <div class="timer-fill" id="timer-line"></div>
            </div>

            <div id="result-msg" style="margin-top:3px; font-size:11px; min-height:14px;"></div>
            <button class="btn-action" id="back-menu-btn" style="display:none; background:#00ffff; color:#000;" onclick="returnToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let currentHp = 42000;
        const maxHp = 42000;
        const damagePerHit = 6000;
        let currentLives = 3;
        let correctAnswer = 0;
        let maxTime = 30000;
        let timerInterval = null;
        let isPlaying = false;
        let currentDifficulty = 'normal';

        const difficulties = {
            easy: { time: 30000, count: 1, lives: 3 },
            normal: { time: 20000, count: 2, lives: 3 },
            hard: { time: 15000, count: 3, lives: 2 },
            nightmare: { time: 15000, count: 4, lives: 1 }
        };

        const victoryQuotes = {
            easy: "ただ試していただけさ",
            normal: "さあ、本気を出そうか",
            hard: "何かおかしいぞ…",
            nightmare: "馬鹿な…どうやってやり遂げたんだ！？"
        };

        const correctQuotes = [
            "ちっ…やるな！",
            "フッ、偶然だな…",
            "次もその運が続くかな？",
            "面白い…だが次はどうかな？"
        ];

        function toRoman(num) {
            if (num <= 0) return "0";
            const romanMap = [
                { val: 40, str: "XL" }, { val: 10, str: "X" },
                { val: 9, str: "IX" }, { val: 5, str: "V" },
                { val: 4, str: "IV" }, { val: 1, str: "I" }
            ];
            let res = "";
            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i].val) {
                    res += romanMap[i].str;
                    num -= romanMap[i].val;
                }
            }
            return res;
        }

        function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let angle = 0;
            function render() {
                ctx.fillStyle = "rgba(3, 3, 10, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = canvas.width / 2;
                const cy = canvas.height * 0.33;

                angle += 0.01;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.arc(0, 0, 110, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0, 255, 255, 0.35)";
                ctx.lineWidth = 3;
                ctx.setLineDash([12, 16]);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.beginPath();
                ctx.ellipse(0, 0, 85, 40, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fill();
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 3.5;
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 18;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(Math.sin(angle * 2) * 12, 0, 18, 0, Math.PI * 2);
                ctx.fillStyle = "#ff3366";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();

                requestAnimationFrame(render);
            }
            render();
        }

        function drawClockToCanvas(canvasId, hour, minute) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            ctx.beginPath();
            ctx.arc(radius, radius, radius - 3, 0, 2 * Math.PI);
            ctx.fillStyle = "#111122";
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#00ffff";
            ctx.stroke();

            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const innerRadius = radius - 10;
                const outerRadius = radius - 4;
                
                const x1 = radius + Math.cos(angle) * innerRadius;
                const y1 = radius + Math.sin(angle) * innerRadius;
                const x2 = radius + Math.cos(angle) * outerRadius;
                const y2 = radius + Math.sin(angle) * outerRadius;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = (i % 3 === 0) ? 2.5 : 1;
                ctx.strokeStyle = (i % 3 === 0) ? "#00ffff" : "#8888aa";
                ctx.stroke();
            }

            const minuteAngle = (minute * 6 - 90) * (Math.PI / 180);
            const minuteHandLength = radius * 0.75;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(minuteAngle) * minuteHandLength, radius + Math.sin(minuteAngle) * minuteHandLength);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#00ffcc";
            ctx.lineCap = "round";
            ctx.stroke();

            const hourAngle = (((hour % 12) + minute / 60) * 30 - 90) * (Math.PI / 180);
            const hourHandLength = radius * 0.50;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.lineTo(radius + Math.cos(hourAngle) * hourHandLength, radius + Math.sin(hourAngle) * hourHandLength);
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#ff3366";
            ctx.lineCap = "round";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(radius, radius, 3.5, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
        }

        function playCorrectSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, now);
            osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playWrongSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [300, 260, 220, 150];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + index * 0.15);
                gain.gain.setValueAtTime(0.4, now + index * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.15);
                osc.stop(now + index * 0.15 + 0.2);
            });
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < currentLives; i++) {
                hearts += "❤️";
            }
            document.getElementById("lives-text").innerText = hearts;
        }

        function startGame(diff) {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            currentDifficulty = diff;
            maxTime = difficulties[diff].time;
            currentHp = maxHp;
            currentLives = difficulties[diff].lives;

            document.getElementById("hp-text").innerText = currentHp;
            document.getElementById("hp-bar").style.width = "100%";
            updateLivesDisplay();
            
            document.getElementById("options-container").style.display = "grid";
            document.getElementById("timer-bar-box").style.display = "block";
            document.getElementById("roman-timer-text").style.display = "block";

            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "block";
            document.getElementById("back-menu-btn").style.display = "none";
            
            nextPuzzle();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            isPlaying = false;
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("menu-screen").classList.add("active");
            document.getElementById("ingame-back-btn").style.display = "none";
        }

        function nextPuzzle() {
            if (currentHp <= 0 || currentLives <= 0) return;
            
            isPlaying = true;
            document.getElementById("result-msg").innerText = "";
            
            let count = difficulties[currentDifficulty].count;
            let hours = [];
            let minutes = [];
            
            for (let i = 0; i < count; i++) {
                hours.push(Math.floor(Math.random() * 12) + 1);
                minutes.push(Math.floor(Math.random() * 12) * 5);
            }

            let result = hours[0];
            let htmlContent = `<div class="clock-canvas-box"><canvas id="clock-0" class="clock-canvas" width="140" height="140"></canvas></div>`;

            for (let i = 1; i < count; i++) {
                result += hours[i];
                htmlContent += `<span class="math-symbol">+</span>`;
                htmlContent += `<div class="clock-canvas-box"><canvas id="clock-${i}" class="clock-canvas" width="140" height="140"></canvas></div>`;
            }

            correctAnswer = ((result - 1) % 12 + 1);
            if (correctAnswer <= 0) correctAnswer += 12;

            document.getElementById("clocks-container").innerHTML = htmlContent;

            for (let i = 0; i < count; i++) {
                drawClockToCanvas(`clock-${i}`, hours[i], minutes[i]);
            }

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrongAns = Math.floor(Math.random() * 12) + 1;
                if (!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = "";
            options.forEach(opt => {
                optionsHtml += `<button class="btn-option" onclick="selectAnswer(${opt})">${toRoman(opt)}</button>`;
            });
            document.getElementById("options-container").innerHTML = optionsHtml;

            const timerLine = document.getElementById("timer-line");
            const romanText = document.getElementById("roman-timer-text");
            
            timerLine.style.width = "100%";
            romanText.innerText = toRoman(Math.ceil(maxTime / 1000));

            clearInterval(timerInterval);
            let startTime = Date.now();
            
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, maxTime - elapsed);
                
                timerLine.style.width = (remaining / maxTime * 100) + "%";
                let secondsLeft = Math.ceil(remaining / 1000);
                romanText.innerText = toRoman(secondsLeft);

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    handleFailure("HẾT GIỜ! Bạn mất 1 mạng.");
                }
            }, 50);
        }

        function selectAnswer(selected) {
            if (!isPlaying) return;
            
            clearInterval(timerInterval);
            isPlaying = false;

            if (selected === correctAnswer) {
                playCorrectSound();

                currentHp -= damagePerHit;
                if (currentHp < 0) currentHp = 0;
                document.getElementById("hp-text").innerText = currentHp;
                document.getElementById("hp-bar").style.width = (currentHp / maxHp * 100) + "%";

                if (currentHp <= 0) {
                    document.getElementById("options-container").style.display = "none";
                    document.getElementById("timer-bar-box").style.display = "none";
                    document.getElementById("roman-timer-text").style.display = "none";
                    
                    let quote = victoryQuotes[currentDifficulty];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66; font-size: 13px;'><b>YOU WON!</b><br><br>"${quote}"</span>`;
                    document.getElementById("back-menu-btn").style.display = "inline-block";
                    document.getElementById("ingame-back-btn").style.display = "none";
                } else {
                    let randomQuote = correctQuotes[Math.floor(Math.random() * correctQuotes.length)];
                    document.getElementById("result-msg").innerHTML = `<span style='color: #00ff66;'>CHÍNH XÁC! Chronos: "${randomQuote}" (-6,000 HP)</span>`;
                    setTimeout(nextPuzzle, 1500);
                }
            } else {
                handleFailure("SAI ĐÁP ÁN! Bạn mất 1 mạng.");
            }
        }

        function handleFailure(msg) {
            isPlaying = false;
            currentLives--;
            updateLivesDisplay();

            if (currentLives <= 0) {
                playGameOverSound();
                document.getElementById("options-container").style.display = "none";
                document.getElementById("timer-bar-box").style.display = "none";
                document.getElementById("roman-timer-text").style.display = "none";
                
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>GAME OVER! Chronos: "バカ野郎！" (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                document.getElementById("back-menu-btn").style.display = "inline-block";
                document.getElementById("ingame-back-btn").style.display = "none";
            } else {
                playWrongSound();
                document.getElementById("result-msg").innerHTML = `<span style='color: #ff3333;'>${msg} Chronos: "バカ野郎！" (Đáp án đúng: ${toRoman(correctAnswer)})</span>`;
                setTimeout(nextPuzzle, 2000);
            }
        }

        window.onload = () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}
            initBackground();
        };
    </script>
</body>
</html>
