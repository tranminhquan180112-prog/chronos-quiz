<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Quiz - Time Trials</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #030308;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-container {
            background: linear-gradient(135deg, #0d0d1a, #16162f);
            border: 3px solid #00ffff;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
        }

        /* Menu Screen Styling - Cực kỳ bắt mắt & hiện đại */
        .menu-screen, .game-screen { display: none; }
        .menu-screen.active, .game-screen.active { display: block; }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            color: #00ffff;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.7), 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .game-subtitle {
            font-size: 13px;
            color: #ff3366;
            letter-spacing: 5px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }

        .menu-banner {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .instructions {
            background: rgba(10, 10, 20, 0.95);
            border-left: 5px solid #ffcc00;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: #ddd;
            line-height: 1.6;
        }

        .difficulty-header {
            font-size: 14px;
            color: #ffcc00;
            font-weight: bold;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-diff {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 13px 18px;
            margin: 10px 0;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-easy { background: rgba(0, 255, 102, 0.1); color: #00ff66; border-color: #00ff66; }
        .btn-normal { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border-color: #00e5ff; }
        .btn-hard { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; }
        .btn-nightmare { background: rgba(255, 51, 51, 0.15); color: #ff3333; border-color: #ff3333; box-shadow: 0 0 10px rgba(255, 51, 51, 0.2); }
        .btn-diff:hover { filter: brightness(1.3); transform: translateY(-2px); box-shadow: 0 0 20px currentColor; }

        /* Boss Area Visuals */
        .boss-area {
            position: relative;
            width: 100%;
            height: 170px;
            background: #e8f4f8;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #ff3333;
            margin-bottom: 12px;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
